# 首页和归档页展示的内容分区
mainSections = ["post"]
# RSS 输出全文
rssFullContent = true
favicon        = "img/favicon-avatar.png"

SortBy              = "default"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "🦊"
    subtitle = "记录技术、折腾与生活。"
    avatar   = "img/avatar.jpg"

[article]
    headingAnchor = true
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "auto"

# 评论：giscus，数据存放在本仓库的 GitHub Discussions
[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "hixtty/hixtty.github.io"
        repoID           = "R_kgDOV3XaPQ"
        category         = "Announcements"
        categoryID       = "DIC_kwDOV3XaPc4DLyNp"
        mapping          = "pathname"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lang             = "zh-CN"
        strict           = 0
        loading          = "lazy"
